<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jesus Side Quest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✝️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <nav class="site-nav">
    <a class="brand" href="index.html">✝️ Jesus Side Quest</a>
    <div class="nav-right">
      <div class="nav-links">
        <div class="nav-group">
          <a class="nav-link current" href="index.html" aria-current="page">Spin</a>
          <a class="nav-link" href="beliefs.html">Slay a Lie</a>
        </div>
        <div class="nav-group">
          <a class="nav-link" href="log.html">Quest Log</a>
          <a class="nav-link" href="beliefs-log.html">Belief Log</a>
        </div>
      </div>
      <a class="nav-link nav-link-standalone" href="community.html">Community</a>
      <div class="cross-points" title="Cross Points">
        <svg class="cross-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <defs>
            <linearGradient id="crossGradNav" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFD54F"/>
              <stop offset="100%" stop-color="#E8912B"/>
            </linearGradient>
          </defs>
          <circle cx="12" cy="12" r="11" fill="url(#crossGradNav)"/>
          <path d="M11 5h2v5h5v2h-5v7h-2v-7H6v-2h5V5z" fill="white"/>
        </svg>
        <span id="cross-points-value">0</span>
      </div>
      <button class="shop-button" id="shop-button" title="Shop">
        <svg class="shop-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <defs>
            <linearGradient id="chestLid" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFD54F"/>
              <stop offset="100%" stop-color="#D9A521"/>
            </linearGradient>
            <linearGradient id="chestBody" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#E8912B"/>
              <stop offset="100%" stop-color="#B8730F"/>
            </linearGradient>
          </defs>
          <path d="M2.5 11 C2.5 6.5 6.8 3.5 12 3.5 C17.2 3.5 21.5 6.5 21.5 11 L21.5 12.5 L2.5 12.5 Z" fill="url(#chestLid)" stroke="#7A5900" stroke-width="0.7"/>
          <rect x="2.5" y="11" width="19" height="1.8" fill="#7A5900" opacity="0.85"/>
          <rect x="2.5" y="12.5" width="19" height="8" rx="1.8" fill="url(#chestBody)" stroke="#7A5900" stroke-width="0.7"/>
          <rect x="2.5" y="15.2" width="19" height="1.3" fill="#7A5900" opacity="0.55"/>
          <rect x="10.6" y="12.5" width="2.8" height="3.6" rx="0.6" fill="#7A5900"/>
          <circle cx="12" cy="14.1" r="0.55" fill="#FFE9A8"/>
          <rect x="11.1" y="5.5" width="1.8" height="5.2" rx="0.4" fill="#FFF7DE"/>
          <rect x="9.4" y="7.2" width="5.2" height="1.8" rx="0.4" fill="#FFF7DE"/>
        </svg>
        <span class="shop-label">Shop</span>
      </button>
    </div>
  </nav>

  <div class="greeting">
    <h1 id="greeting-text">Welcome!</h1>
    <p id="greeting-subtitle">Let's tackle today's side quest.</p>
  </div>

  <div class="hero">
    <div class="reel-wrapper" id="reel-wrapper">
      <!-- Cherub silhouette: "Angel outfit" icon by Lorc, game-icons.net (CC BY 3.0),
           recolored gold. Attribution required — https://game-icons.net/1x1/lorc/angel-outfit.html -->
      <svg class="cherub-defs" aria-hidden="true">
        <defs>
          <linearGradient id="cherubGoldGrad" x1="0%" y1="0%" x2="30%" y2="100%">
            <stop offset="0%" stop-color="#FFF3C4"/>
            <stop offset="45%" stop-color="#D9A521"/>
            <stop offset="100%" stop-color="#8a6100"/>
          </linearGradient>
          <symbol id="cherub-symbol" viewBox="0 0 512 512">
            <path fill="url(#cherubGoldGrad)" stroke="#6b4d00" stroke-width="3" stroke-linejoin="round" d="M260.72 29.094c-54.533 0-98.97 21.704-98.97 48.312 0 26.61 44.437 48.28 98.97 48.28 54.53 0 98.967-21.67 98.967-48.28S315.25 29.094 260.72 29.094zm0 13.25c40.07 0 71.81 15.508 71.81 35.062s-31.74 35.47-71.81 35.47c-40.073 0-72.69-15.916-72.69-35.47 0-19.552 32.617-35.064 72.69-35.062zM86.53 57.187c-13.242-.094-32.234 14.59-42.31 37.688-43.3 99.244-9.583 359.695 87.874 351.97-22.002-50.492-43.8-107.983-56.72-168.75 26.337 72.494 72.33 135.58 117.845 120.186-32.017-40.185-66.048-87.265-90.032-140.342 35.016 59.175 85.37 105.853 123.03 85.5-29.742-26.583-61.568-57.524-88.812-93.25 39.647 37.38 87.092 61.34 112.25 37.75-47.69-21.07-94.37-53.67-125.062-89.75-16.312-19.176-28.195-39.39-32.72-60-2.26-10.306-2.508-20.796-.468-30.938.02-.095.043-.186.063-.28.007-.044.022-.083.03-.126 4.05-21.265 15.043-35.413 4.5-45.97-2.484-2.487-5.76-3.66-9.47-3.687zm347.658 0c-3.71.027-6.954 1.2-9.438 3.688-8.176 8.186-3.416 18.564 1.03 32.72 6.153 14.187 7.144 29.566 3.845 44.593-4.524 20.61-16.44 40.824-32.75 60-30.798 36.206-77.67 68.907-125.53 89.968 25.22 23.208 72.482-.71 112-37.97-27.245 35.728-59.07 66.67-88.814 93.25 37.662 20.355 88.016-26.323 123.033-85.498-23.985 53.077-58.016 100.157-90.032 140.343 45.515 15.395 91.478-47.69 117.814-120.186-12.918 60.768-34.686 118.26-56.688 168.75 97.457 7.726 131.142-252.725 87.844-351.97-10.077-23.097-29.07-37.78-42.313-37.686zm-22.22 73.97c-100.397 68.228-200.733 82.462-301.25 5.468 4.02 15.655 13.89 32.733 28.126 49.47 28.922 34 75.48 66.378 121.906 86.31 46.426-19.932 92.984-52.31 121.906-86.31 14.98-17.613 25.138-35.594 28.72-51.907.223-1.02.416-2.027.593-3.032z"/>
          </symbol>
        </defs>
      </svg>
      <svg class="ark-cherub left"><use href="#cherub-symbol"/></svg>
      <svg class="ark-cherub right"><use href="#cherub-symbol"/></svg>
      <div class="ark-lid-tier t1"></div>
      <div class="ark-lid-tier t2"></div>
      <div class="ark-molding"></div>
      <div class="ark-pole left"></div>
      <div class="ark-pole right"></div>
      <div class="ark-ring left"></div>
      <div class="ark-ring right"></div>
      <div class="reel idle" id="reel">
        <div class="ark-medallion tl"></div>
        <div class="ark-medallion tr"></div>
        <div class="ark-medallion bl"></div>
        <div class="ark-medallion br"></div>
        <div class="divine-flame" style="left:6%; animation-delay:0s"></div>
        <div class="divine-flame" style="left:20%; animation-delay:0.17s"></div>
        <div class="divine-flame" style="left:34%; animation-delay:0.34s"></div>
        <div class="divine-flame" style="left:50%; animation-delay:0.51s"></div>
        <div class="divine-flame" style="left:66%; animation-delay:0.68s"></div>
        <div class="divine-flame" style="left:80%; animation-delay:0.85s"></div>
        <div class="divine-flame" style="left:94%; animation-delay:1.02s"></div>
        <span class="divine-particle gold" style="left:9%; animation-delay:0s"></span>
        <span class="divine-particle white" style="left:19%; animation-delay:0.35s"></span>
        <span class="divine-particle gold" style="left:29%; animation-delay:0.7s"></span>
        <span class="divine-particle white" style="left:39%; animation-delay:1.05s"></span>
        <span class="divine-particle gold" style="left:52%; animation-delay:0.18s"></span>
        <span class="divine-particle white" style="left:62%; animation-delay:0.53s"></span>
        <span class="divine-particle gold" style="left:72%; animation-delay:0.88s"></span>
        <span class="divine-particle white" style="left:82%; animation-delay:1.23s"></span>
        <span class="divine-particle gold" style="left:91%; animation-delay:0.42s"></span>
        <span class="divine-particle white" style="left:97%; animation-delay:0.77s"></span>
        <div class="reel-content" id="reel-content">
          <span class="reel-placeholder" id="reel-placeholder">Tap the button below to spin!</span>
        </div>
      </div>
      <div class="ark-base">
        <div class="ark-shadow"></div>
        <div class="ark-foot left"></div>
        <div class="ark-foot right"></div>
      </div>
    </div>

    <div class="button-row">
      <a class="secondary-button" href="beliefs.html">⚔️ Slay a Lie</a>
      <div class="spin-column">
        <button class="spin-button" id="spin-button">🎲 Spin a Side Quest</button>
        <p class="spin-status" id="spin-status"></p>
      </div>
    </div>

    <p class="progress-summary" id="progress-summary"></p>

    <button class="todays-quests-toggle" id="todays-quests-toggle">📋 Today's Quests</button>
    <div class="todays-quests-panel" id="todays-quests-panel"></div>

    <button class="test-spin-button" id="test-spin-button">🔧 +1 Spin (test only)</button>
    <button class="test-spin-button" id="test-points-button">🔧 +50 Points (test only)</button>
  </div>

  <footer class="credit">Cherub icon by <a href="https://game-icons.net/1x1/lorc/angel-outfit.html" target="_blank" rel="noopener">Lorc, game-icons.net</a> (CC BY 3.0).</footer>
</div>

<div class="shop-modal-backdrop" id="shop-modal-backdrop">
  <div class="shop-modal" id="shop-modal">
    <button class="shop-modal-close" id="shop-modal-close" aria-label="Close">✕</button>
    <div class="shop-modal-badge">🏛️ Shop</div>

    <div class="shop-tabs">
      <button class="shop-tab" data-tab="upgrades">Upgrades</button>
      <button class="shop-tab active" data-tab="cosmetics">Cosmetics</button>
      <button class="shop-tab" data-tab="event">Event</button>
    </div>

    <div class="shop-panel" data-panel="upgrades" id="shop-panel-upgrades">
      <p class="shop-placeholder">Upgrades are coming soon.</p>
    </div>

    <div class="shop-panel active" data-panel="cosmetics" id="shop-panel-cosmetics"></div>

    <div class="shop-panel" data-panel="event" id="shop-panel-event">
      <p class="shop-placeholder">This shop opens when there's an event.</p>
    </div>
  </div>
</div>

<script src="js/quest-data.js"></script>
<script src="js/storage.js"></script>
<script src="js/sound.js"></script>
<script src="js/spin.js"></script>
<script src="js/spin-limit.js"></script>
<script src="js/points.js"></script>
<script src="js/shop-data.js"></script>
<script src="js/todays-quests.js"></script>
<script src="js/app.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
